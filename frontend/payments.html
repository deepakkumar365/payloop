<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayLoop - Payments</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="flex flex-col h-screen"></div>
    
    <template id="page-content">
        <div class="container mx-auto p-4">
            <div class="bg-white p-6 rounded-lg shadow-md mb-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold text-gray-800">Collect Payment</h2>
                </div>
                
                <form id="payment-form" class="space-y-4 max-w-md">
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Customer</label>
                        <select id="payment-customer" class="shadow border rounded w-full py-2 px-3" required>
                            <option value="">Select Customer</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Shop (Optional)</label>
                        <select id="payment-shop" class="shadow border rounded w-full py-2 px-3">
                            <option value="">No Shop</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Amount</label>
                        <input type="number" step="0.01" id="payment-amount" class="shadow border rounded w-full py-2 px-3" required>
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Notes</label>
                        <textarea id="payment-notes" class="shadow border rounded w-full py-2 px-3" rows="3"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">
                        Collect Payment
                    </button>
                </form>
            </div>
            
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-2xl font-bold text-gray-800 mb-4">Payment History</h2>
                
                <div class="overflow-x-auto">
                    <table class="min-w-full bg-white">
                        <thead class="bg-gray-200">
                            <tr>
                                <th class="py-2 px-4 text-left">Date</th>
                                <th class="py-2 px-4 text-left">Customer</th>
                                <th class="py-2 px-4 text-left">Shop</th>
                                <th class="py-2 px-4 text-left">Amount</th>
                                <th class="py-2 px-4 text-left">Notes</th>
                            </tr>
                        </thead>
                        <tbody id="payments-table">
                            <tr>
                                <td colspan="5" class="text-center py-4 text-gray-500">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </template>
    
    <script src="static/js/config.js"></script>
    <script src="static/js/auth.js"></script>
    <script src="static/js/components.js"></script>
    <script src="static/js/layout.js"></script>
    <script src="static/js/payments.js"></script>
</body>
</html>
