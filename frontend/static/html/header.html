<header class="bg-blue-900 text-white px-6 py-4 shadow-md flex items-center justify-between">
    <div class="flex items-center space-x-4">
        <h1 class="text-2xl font-bold">PayLoop</h1>
        <div class="h-6 border-l border-blue-700"></div>
        <span class="text-blue-200 text-sm">Vendor Collection System</span>
    </div>
    <div class="relative">
        <button id="user-menu-button" class="flex items-center space-x-2 focus:outline-none">
            <div class="text-right hidden md:block">
                <p id="header-user-name" class="font-semibold"></p>
                <p id="header-user-role" class="text-blue-300 text-sm"></p>
            </div>
            <svg class="w-5 h-5 text-blue-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </button>
        <!-- Dropdown Menu -->
        <div id="user-menu-dropdown" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-50 text-gray-800">
            <button onclick="handleLogout()" class="block w-full text-left px-4 py-2 text-sm hover:bg-gray-100">Logout</button>
        </div>
    </div>
</header>
